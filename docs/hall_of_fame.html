<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Hall of Fame - Travel Achievements</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./static/style.css">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            background: #f8f9fa;
            min-height: 100vh;
            color: #333;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
            color: #2c3e50;
        }
        .header h1 { margin: 0 0 15px 0; font-size: 2.5em; font-weight: 700; color: #2c3e50; }
        .header p { margin: 0; font-size: 1.2em; color: #6c757d; }

        .achievements-count {
            background: #007bff;
            color: white;
            border-radius: 50px;
            padding: 10px 25px;
            display: inline-block;
            margin-top: 15px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.2);
        }

        .hof-gallery {
            display: grid;
            gap: 25px;
            margin-bottom: 40px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .hof-item {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .hof-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ffd700, #ffed4e, #ffd700);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .hof-item:hover::before { opacity: 1; }
        .hof-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.15);
        }

        .diploma-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }
        .hof-item:hover .diploma-image { transform: scale(1.02); }

        .diploma-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #2c3e50;
            margin: 0;
            line-height: 1.4;
        }

        .achievement-badge {
            position: absolute;
            top: 15px; right: 15px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #856404;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(255,215,0,0.3);
        }

        .empty-state { text-align: center; padding: 60px 20px; color: #6c757d; }
        .empty-state-icon { font-size: 4em; margin-bottom: 20px; opacity: 0.7; }
        .empty-state h3 { font-size: 1.5em; margin-bottom: 10px; }
        .empty-state p { opacity: 0.8; max-width: 400px; margin: 0 auto; }

        .back-container { text-align: center; margin-top: 40px; }
        .back-link {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 15px 30px;
            background: white; color: #007bff;
            text-decoration: none; border-radius: 50px;
            border: 2px solid #007bff; font-weight: 600; font-size: 16px;
            transition: all 0.3s ease; box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }
        .back-link:hover {
            background: #007bff; color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 123, 255, 0.2);
        }

        .modal {
            display: none;
            position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            margin: 20px; padding: 25px;
            border-radius: 16px;
            max-width: 90vw; max-height: 90vh;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .modal-caption {
            margin-top: 20px; color: #2c3e50;
            font-size: 1.1em; font-weight: 600;
            text-align: center; max-width: 500px;
        }

        .close {
            position: absolute; top: -50px; right: -10px;
            color: white; font-size: 2.5em; font-weight: bold;
            cursor: pointer; z-index: 1100;
            width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .close:hover { background: rgba(0,0,0,0.7); transform: scale(1.1); }

        .modal-nav {
            position: absolute; top: 50%;
            transform: translateY(-50%);
            color: white; font-size: 2em; font-weight: bold;
            cursor: pointer; z-index: 1100;
            width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            transition: all 0.3s ease; user-select: none;
        }
        .modal-nav:hover { background: rgba(0,0,0,0.7); transform: translateY(-50%) scale(1.1); }
        .modal-nav.prev { left: -70px; }
        .modal-nav.next { right: -70px; }
        .modal-nav.disabled { opacity: 0.3; cursor: not-allowed; }
        .modal-nav.disabled:hover { background: rgba(0,0,0,0.5); transform: translateY(-50%) scale(1); }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .header h1 { font-size: 2em; }
            .header p { font-size: 1em; }
            .hof-gallery { grid-template-columns: 1fr; gap: 20px; }
            .diploma-image { height: 200px; }
            .close { top: -40px; right: 0; font-size: 2em; width: 40px; height: 40px; }
            .modal-nav { font-size: 1.5em; width: 40px; height: 40px; }
            .modal-nav.prev { left: -50px; }
            .modal-nav.next { right: -50px; }
            .modal-content { margin: 10px; padding: 20px; }
        }
        @media (min-width: 1024px) {
            .hof-gallery { grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); }
            .diploma-image { height: 280px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Hall of Fame</h1>
            <p>Celebrating travel achievements and memorable journeys</p>
            <div id="achievementsCount" class="achievements-count" style="display: none;"></div>
        </div>

        <div id="gallery" class="hof-gallery"></div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state-icon">🎖️</div>
            <h3>No Achievements Yet</h3>
            <p>Start exploring Bulgarian tourist sites to unlock your first achievement and earn a place in the Hall of Fame!</p>
        </div>

        <div id="imgModal" class="modal" onclick="closeModal(event)">
            <span class="close" onclick="closeModal(event)">&times;</span>
            <div class="modal-nav prev" id="prevBtn" onclick="navigateModal(-1)">‹</div>
            <div class="modal-nav next" id="nextBtn" onclick="navigateModal(1)">›</div>
            <div class="modal-content">
                <img id="modalImg" src="" alt="Achievement Diploma">
                <div id="modalCaption" class="modal-caption"></div>
            </div>
        </div>

        <div class="back-container">
            <a href="./index.html" class="back-link">← Back to Main Map</a>
        </div>
    </div>

    <script>
    (function () {
      'use strict';

      var DIPLOMA_TITLES = {
        '100Nto.png': 'Опознай България - 100 национални туристически обекта',
        '10pp.png': 'Покорител на десетте планински първенци',
        '5planini.png': 'Е4: Петте планини',
        'kom_emine.png': 'Е3: Ком Емине'
      };

      var diplomaData = [];
      var currentImageIndex = 0;

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      }

      function renderGallery() {
        var gallery = document.getElementById('gallery');
        var empty = document.getElementById('emptyState');
        var count = document.getElementById('achievementsCount');

        if (!diplomaData.length) {
          gallery.style.display = 'none';
          empty.style.display = 'block';
          return;
        }

        count.style.display = 'inline-block';
        count.textContent = diplomaData.length + ' Achievement' +
          (diplomaData.length === 1 ? '' : 's') + ' Unlocked';

        gallery.innerHTML = diplomaData.map(function (d, i) {
          return '<div class="hof-item" data-idx="' + i + '">' +
                   '<div class="achievement-badge">Achievement</div>' +
                   '<img src="' + escapeHtml(d.src) + '" alt="Diploma ' + (i + 1) + '" class="diploma-image">' +
                   '<h3 class="diploma-title">' + escapeHtml(d.caption) + '</h3>' +
                 '</div>';
        }).join('');

        Array.prototype.forEach.call(gallery.querySelectorAll('.hof-item'), function (item, i) {
          item.style.opacity = '0';
          item.style.transform = 'translateY(30px)';
          setTimeout(function () {
            item.style.transition = 'all 0.6s ease';
            item.style.opacity = '1';
            item.style.transform = 'translateY(0)';
          }, i * 100);
          item.addEventListener('click', function () {
            openModal(parseInt(item.getAttribute('data-idx'), 10));
          });
        });
      }

      function openModal(idx) {
        currentImageIndex = idx;
        document.getElementById('imgModal').style.display = 'flex';
        updateModalContent();
        updateNavigationButtons();
        document.body.style.overflow = 'hidden';
      }

      function updateModalContent() {
        if (diplomaData.length && currentImageIndex >= 0 && currentImageIndex < diplomaData.length) {
          document.getElementById('modalImg').src = diplomaData[currentImageIndex].src;
          document.getElementById('modalCaption').textContent = diplomaData[currentImageIndex].caption;
        }
      }

      function updateNavigationButtons() {
        var prevBtn = document.getElementById('prevBtn');
        var nextBtn = document.getElementById('nextBtn');

        if (diplomaData.length <= 1) {
          prevBtn.style.display = 'none';
          nextBtn.style.display = 'none';
          return;
        }
        prevBtn.style.display = 'flex';
        nextBtn.style.display = 'flex';
        prevBtn.classList.toggle('disabled', currentImageIndex === 0);
        nextBtn.classList.toggle('disabled', currentImageIndex === diplomaData.length - 1);
      }

      function navigateModal(direction) {
        var newIndex = currentImageIndex + direction;
        if (newIndex >= 0 && newIndex < diplomaData.length) {
          currentImageIndex = newIndex;
          updateModalContent();
          updateNavigationButtons();
        }
      }

      function closeModal(event) {
        if (event.target.classList.contains('modal') || event.target.classList.contains('close')) {
          document.getElementById('imgModal').style.display = 'none';
          document.getElementById('modalImg').src = '';
          document.body.style.overflow = 'auto';
        }
      }

      // Expose for the inline onclick handlers in the modal.
      window.openModal = function (srcOrIdx, caption) {
        // If called with an index, use it directly. Otherwise look up the index by src.
        if (typeof srcOrIdx === 'number') {
          openModal(srcOrIdx);
        } else {
          var idx = diplomaData.findIndex(function (d) { return d.src === srcOrIdx; });
          openModal(idx === -1 ? 0 : idx);
        }
      };
      window.navigateModal = navigateModal;
      window.closeModal = closeModal;

      // Keyboard navigation
      document.addEventListener('keydown', function (e) {
        var modal = document.getElementById('imgModal');
        if (modal.style.display !== 'flex') return;
        if (e.key === 'Escape') closeModal({ target: { classList: ['modal'] } });
        else if (e.key === 'ArrowLeft') { e.preventDefault(); navigateModal(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); navigateModal(1); }
      });

      // Load diplomas from the manifest generated by scripts/build_static.py.
      fetch('./diplomas.json')
        .then(function (r) { return r.json(); })
        .then(function (files) {
          diplomaData = files.map(function (f) {
            return {
              src: './static/diplomas/' + f,
              caption: DIPLOMA_TITLES[f] || f,
            };
          });
          renderGallery();
        })
        .catch(function (err) {
          // No diplomas.json (or invalid) — show the empty state.
          renderGallery();
        });
    })();
    </script>
</body>
</html>
